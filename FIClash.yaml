  - DOMAIN,vip.qmeng.top, DIRECT
  - DOMAIN,us.qmeng.xyz, Media

  # Ash Emby
  - DOMAIN-SUFFIX,ash.yt, Media

  # 云海 Emby
  - DOMAIN,emby.oceancloud.asia,Media

  # Lily Emby
  - DOMAIN,cdn.lilyemby.com,DIRECT
  # Lily Emby
  - DOMAIN-SUFFIX,lilyemby.com,Media
  
  # SNTP Emby
  - DOMAIN,server3.cn2gias.uk,Media

  # 69云 Emby
  - DOMAIN-SUFFIX,69yun69.com,Media
  
  # Notion
  - DOMAIN-KEYWORD,notion,Ultimate
  
