# FIClash 配置
# 日期：2025年8月25日 12:40

port: 7890
socks-port: 7891
allow-lan: true
mode: Rule
log-level: silent
# external-controller: 127.0.0.1:9090

# 开启 RESTful API
# 监听在 127.0.0.1 的 8080 端口
external-controller: 127.0.0.1:8080
# 你可以加入 secret 进行 API 鉴权
# 鉴权的方式为在 Http Header 中加入 Authorization: Bearer ${secret}
secret: whoami
dns:
  enable: true
  listen: 0.0.0.0:53
  ipv6: true
  default-nameserver:
    - 119.29.29.29
    - 233.5.5.5
  nameserver:
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query
  fallback:
    # 腾讯DoH2
    - https://120.53.53.53/dns-query
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # 在以下列表的域名将不会被解析为 fake ip，这些域名相关的解析请求将会返回它们真实的 IP 地址
  fake-ip-filter:
    - '*.lan'
    - cable.auth.com
    - +.msftconnecttest.com
    - +.msftncsi.com
    - network-test.debian.org
    - detectportal.firefox.com
    - resolver1.opendns.com
    - +.srv.nintendo.net
    - +.stun.playstation.net
    - xbox.*.microsoft.com
    - +.xboxlive.com
    - stun.*
    - global.turn.twilio.com
    - global.stun.twilio.com
    - localhost.*.qq.com
    - +.logon.battlenet.com.cn
    - +.logon.battle.net
    - +.blzstatic.cn
    - +.cmpassport.com
    - id6.me
    - open.e.189.cn
    - mdn.open.wo.cn
    - opencloud.wostore.cn
    - auth.wosms.cn
    - +.jegotrip.com.cn
    - +.icitymobile.mobi
    - +.pingan.com.cn
    - +.cmbchina.com
    - +.cmbchina.com.cn
    - +?miwifi.com
    - pool.ntp.org
    - +.pool.ntp.org
    - ntp.*.com
    - time.*.com
    - ntp?.*.com
    - time?.*.com
    - time.*.gov
    - time.*.edu.cn
    - +.ntp.org.cn
    - time.*.apple.com
    - PDC._msDCS.*.*
    - DC._msDCS.*.*
    - GC._msDCS.*.*
profile:
  tracing: true
# interval 代表间隔时间，单位为 s；
# tolerance 代表容差时间，单位为 ms；
# 由于分流规则引用了 GitHub 文件，如果你的本地网络无法访问 GitHub，你将无法让 Clash 正常工作；
# 你需要先使用翻墙工具让本地网络出墙，再启动 Clash 才能正常下载分流规则并正常启动，待 Clash 启动成功并更新完订阅资源和分流规则之后，方可关闭你之前打开的翻墙工具；

# 节点订阅
# 默认每三小时更新一次节点订阅，每 6s 检测一次健康度。
proxy-providers:
  全球节点:
    type: http
    path: ./proxy_provider/全球节点.yaml
    url: https://gist.githubusercontent.com/Mojit000/1b86dc74a8ea77d0001823e78831a43f/raw/Mihomo
    interval: 86400
    filter: '^(?=.*(.))(?!.*((?i)群|邀请|BT|ATT|🔟|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|(\b(USE|USED|TOTAL|EXPIRE|EMAIL|Panel)\b|(\d{4}-\d{2}-\d{2}|\dG)))).*$'
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 3600

# > 策略组
proxy-groups:
  - name: YouTube
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/youtube.png
    type: select
    use:
      - 全球节点
    filter: '(?=.*(?:香港|台湾|美国|日本|韩国|新加坡))^((?!微斯|神器).)*$'
    
  - name: Emby
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/emby.png
    type: select
    use:
      - 全球节点
    filter: '(?=.*(?:台湾|新加坡))^((?!微斯|神器).)*$'
    
  - name: Spotify
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/spotify(green).png
    type: select
    use:
      - 全球节点
    filter: '新加坡|狮城|🇸🇬|香港|HK|🇭🇰'
    
  - name: uTorrent
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/alist.png
    type: url-test
    use:
      - 全球节点
    filter: '(?=.*(?:香港|台湾|美国|新加坡))^((?!微斯|神器).)*$'
    
  - name: OpenAI
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/ChatGPT-green.png
    type: select
    use:
      - 全球节点
    filter: '美国|🇺🇸|US|新加坡|狮城|🇸🇬|SG'

  - name: Global
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/Firefox.png
    type: select
    disable-udp: false
    use:
      - 全球节点
    # filter: '(?=.*(?:泡泡|哪吒))'
    
