  Proxy:
    behavior: classical
    interval: 86400
    path: ./rule_provider/Proxy.yaml
    type: http
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Proxy/Proxy.yaml
  Spotify:
    behavior: classical
    interval: 86400
    path: ./rule_provider/Spotify.yaml
    type: http
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Spotify/Spotify.yaml
  TikTok:
    behavior: classical
    interval: 86400
    path: ./rule_provider/TikTok.yaml
    type: http
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/TikTok/TikTok.yaml
  Twitter:
    behavior: classical
    interval: 86400
    path: ./rule_provider/Twitter.yaml
    type: http
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Twitter/Twitter.yaml
  YouTube:
    behavior: classical
    interval: 86400
    path: ./rule_provider/YouTube.yaml
    type: http
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.yaml
  LAN:
    behavior: classical
    interval: 86400
    path: ./rule_provider/LAN.yaml
    type: http
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Lan/Lan.yaml

# 分流规则
rules:
