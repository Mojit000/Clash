# FIClash 配置
# 日期：2026年03月08日 22:00

# General
port: 7890
socks-port: 7891
allow-lan: true
bind-address: "*"
mode: Rule
log-level: info

# RESTful API
external-controller: 127.0.0.1:9090
secret: whoami
external-ui: ./ui

# DNS 配置
dns:
  enable: true
  listen: 0.0.0.0:53
  ipv6: false
  default-nameserver:
    - 119.29.29.29
    - 233.5.5.5
  nameserver:
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    # 腾讯DoH2
    - https://120.53.53.53/dns-query
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # 在以下列表的域名将不会被解析为 fake ip，这些域名相关的解析请求将会返回它们真实的 IP 地址
  fake-ip-filter:
    - '*.lan'
    - cable.auth.com
    - +.msftconnecttest.com
    - +.msftncsi.com
    - network-test.debian.org
    - detectportal.firefox.com
    - resolver1.opendns.com
    - +.srv.nintendo.net
    - +.stun.playstation.net
    - xbox.*.microsoft.com
    - +.xboxlive.com
    - stun.*
    - global.turn.twilio.com
    - global.stun.twilio.com
    - localhost.*.qq.com
    - +.logon.battlenet.com.cn
    - +.logon.battle.net
    - +.blzstatic.cn
    - +.cmpassport.com
    - id6.me
    - open.e.189.cn
    - mdn.open.wo.cn
    - opencloud.wostore.cn
    - auth.wosms.cn
    - +.jegotrip.com.cn
    - +.icitymobile.mobi
    - +.pingan.com.cn
    - +.cmbchina.com
    - +.cmbchina.com.cn
    - +?miwifi.com
    - pool.ntp.org
    - +.pool.ntp.org
    - ntp.*.com
    - time.*.com
    - ntp?.*.com
    - time?.*.com
    - time.*.gov
    - time.*.edu.cn
    - +.ntp.org.cn
    - time.*.apple.com
    - PDC._msDCS.*.*
    - DC._msDCS.*.*
    - GC._msDCS.*.*
profile:
  tracing: true

# 节点订阅
proxy-providers:
  全球节点:
    type: http
    path: ./proxy_provider/全球节点.yaml
    url: YOUR_URL
    interval: 86400
    filter: '^(?=.*(?i)(美国|🇺🇸|新加坡|🇸🇬|香港|🇭🇰|台湾|🇹🇼|日本|🇯🇵|自建|🇨🇳|俄罗斯|🇷🇺))(?!(?:.*(?i)(群|邀请|BT|公益|游戏|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|\b(USE|USED|TOTAL|EXPIRE|EMAIL|Panel)\b|\d{4}-\d{2}-\d{2}|\dG))).*$'
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 3600

# 策略组
proxy-groups:
  - name: Media
    icon: https://raw.githubusercontent.com/Mojit000/Surge/master/icon/Senplayer.png
    type: select
    use:
      - 全球节点
    filter: '^(?!.*(?:美国|🇺🇸|日本|🇯🇵|香港|🇭🇰)).*(?:新加坡|🇸🇬|台湾|🇹🇼|自建|🇨🇳).*$'
  
  - name: TikTok
    icon: https://raw.githubusercontent.com/Mojit000/Surge/master/icon/TikTok.png
    type: select
    use:
      - 全球节点
    filter: '.*(?:美国|🇺🇸|台湾|🇹🇼|自建|🇨🇳|新加坡|🇸🇬).*$'
    
  - name: Twitter
    icon: https://raw.githubusercontent.com/Mojit000/Surge/refs/heads/master/icon/Twitter.png
    type: select
    use:
      - 全球节点
    filter: '.*(?:美国|🇺🇸|新加坡|🇸🇬|台湾|🇹🇼|自建|🇨🇳|俄罗斯|🇷🇺).*'
  
  - name: AiAgent
    icon: https://raw.githubusercontent.com/Mojit000/Surge/master/icon/Gemini.png
    type: select
    use:
      - 全球节点
    filter: '.*(?:美国|US|🇺🇸|自建).*$'
    
  - name: YouTube
    icon: https://raw.githubusercontent.com/Mojit000/Surge/master/icon/YouTube.png
    type: select
    use:
      - 全球节点
    filter: '^((?!✰✰|★★).)*$'
    
  - name: Ultimate
    icon: https://raw.githubusercontent.com/Mojit000/Surge/master/icon/Egern.png
    type: select
    use:
      - 全球节点
    
# 分流规则订阅
rule-providers:
  AntiAD:
    behavior: domain
    interval: 86400
    path: ./rule_provider/AntiAD.yaml
    type: http
    url: https://anti-ad.net/clash.yaml
  ChinaMaxNoIP:
    behavior: classical
    interval: 86400
    path: ./rule_provider/ChinaMaxNoIP.yaml
    type: http
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMaxNoIP/ChinaMaxNoIP.yaml
  Duolingo:
    behavior: classical
    interval: 86400
    path: ./rule_provider/Duolingo.yaml
    type: http
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Duolingo/Duolingo.yaml
  Github:
    behavior: classical
    interval: 86400
    path: ./rule_provider/Github.yaml
    type: http
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GitHub/GitHub.yaml
  Google:
